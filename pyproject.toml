[project]
name = "doc-chunker"
version = "0.1.0"
description = "Turn Markdown, HTML and PDF files into clean, labeled text chunks for RAG."
readme = "README.md"
authors = [
    { name = "Soumya Sinha", email = "soumya.sinha98@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pypdf>=7.1.0",
]

[project.scripts]
doc-chunker = "doc_chunker.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
